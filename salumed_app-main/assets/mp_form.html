<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://sdk.mercadopago.com/js/v2"></script>
  <style>
    body { font-family: Arial; padding:20px; background:#f9f9f9; margin:0; }
    input, select { width:100%; padding:14px; margin:8px 0; border:1px solid #ccc; border-radius:8px; box-sizing:border-box; font-size:16px; }
    button { width:100%; padding:16px; background:#009ee3; color:white; border:none; border-radius:8px; font-size:18px; margin-top:20px; }
    select:disabled { background: #f5f5f5; opacity: 0.7; }
  </style>
</head>
<body>
  <form id="form-checkout">
    <input type="text" id="form-checkout__cardNumber" placeholder="Número de tarjeta" />
    <input type="text" id="form-checkout__expirationDate" placeholder="MM/YY" />
    <input type="text" id="form-checkout__securityCode" placeholder="CVV" />
    <input type="text" id="form-checkout__cardholderName" placeholder="Titular" />
    <input type="email" id="form-checkout__cardholderEmail" value="test@test.com" readonly />
    <select id="form-checkout__identificationType">
      <!-- Opciones para México - evita el fallo de mp.getIdentificationTypes() en WebView -->
      <option value="DNI">DNI (Documento Nacional de Identidad)</option>
      <option value="CI">Cédula de Identidad</option>
      <option value="CUIT">CUIT</option>
      <option value="CUIL">CUIL</option>
      <option value="CDI">CDI</option>
      <option value="LE">LE (Libreta de Enrolamiento)</option>
      <option value="LC">LC (Libreta Cívica)</option>
      <option value="EN">EN (Enrolamiento Nacional)</option>
    </select>
    <input type="text" id="form-checkout__identificationNumber" placeholder="Número de documento" />
    <button type="submit" id="submit-btn">Activar suscripción</button>
  </form>

  <script>
    const publicKey = "APP_USR-414cd0a7-ecee-42b3-a01b-b062315453f1";
    const mp = new MercadoPago(publicKey, { locale: "es-MX" });

    const cardForm = mp.cardForm({
      form: {
        id: "form-checkout",
        cardNumber: { id: "form-checkout__cardNumber" },
        expirationDate: { id: "form-checkout__expirationDate" },
        securityCode: { id: "form-checkout__securityCode" },
        cardholderName: { id: "form-checkout__cardholderName" },
        cardholderEmail: { id: "form-checkout__cardholderEmail" },
        identificationType: { id: "form-checkout__identificationType" },
        identificationNumber: { id: "form-checkout__identificationNumber" },
      },
      callbacks: {
        onFormMounted: (error) => {
          if (error) console.error("Error montando form:", error);
          else console.log("Form montado correctamente");
        },
        onSubmit: (event) => {
          event.preventDefault();
          // EVITA LIMPIEZA: deshabilita botón para no resubmit
          const btn = document.getElementById("submit-btn");
          btn.disabled = true;
          btn.textContent = "Procesando...";
          
          const { token, paymentMethodId } = cardForm.getCardFormData();
          console.log("Datos del form:", { token, paymentMethodId });
          
          if (token && paymentMethodId) {
            window.TokenChannel.postMessage(token);
          } else {
            alert("Por favor, completa todos los campos correctamente. Revisa número de tarjeta y fecha.");
            btn.disabled = false;
            btn.textContent = "Activar suscripción";
          }
        },
        onFetching: (resource) => console.log("Cargando recurso:", resource),
        onValidating: (resource) => console.log("Validando:", resource),
        onError: (error) => {
          console.error("Error en form:", error);
          alert("Error de validación: " + (error.message || "Revisa los datos"));
          document.getElementById("submit-btn").disabled = false;
          document.getElementById("submit-btn").textContent = "Activar suscripción";
        }
      }
    });

    // Set default DNI para México
    document.getElementById("form-checkout__identificationType").value = "DNI";
    console.log("Form inicializado con DNI por default");
  </script>
</body>
</html>
